<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Kampüs Etkinlikleri - Etkinlik Güncelle</title>
    <link rel="stylesheet" href="css/2416501017.css">
</head>
<body>
    <header>
        <h1>Etkinlik Güncelle</h1>
        <nav>
            <a href="index.html">Ana Sayfa</a>
            <a href="etkinlikler.html">Etkinlikler</a>
            <a href="etkinlik-ekle.html">Ekle</a>
            <a href="etkinlik-guncelle.html">Güncelle</a>
        </nav>
    </header>

    <main>
        <form>
            <div>
                <label for="etkinlik-adi">Etkinlik adı</label><br>
                <input type="text" id="etkinlik-adi" value="Kariyer Günleri 2026" required>
            </div>

            <div>
                <label for="kategori">Kategori</label><br>
                <select id="kategori" required>
                    <option value="seminer" selected>Seminer</option>
                    <option value="atolye">Atölye</option>
                    <option value="soylesi">Söyleşi</option>
                </select>
            </div>

            <div>
                <label for="tarih">Tarih</label><br>
                <input type="date" id="tarih" value="2026-10-12" required>
            </div>

            <div>
                <label for="aciklama">Açıklama</label><br>
                <textarea id="aciklama">Mezun söyleşileri ve şirket standları.</textarea>
            </div>

            <div>
                <button type="submit">Güncelle</button>
            </div>
        </form>
    </main>

    <footer>
        <p>&copy; 2026 Kampüs Etkinlikleri</p>
    </footer>
</body>
</html>
